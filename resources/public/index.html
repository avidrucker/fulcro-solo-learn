<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoFocus</title>

  <!-- PWA manifest + theme color + icon (Phase 7.19 / S-pwa-offline).
       The webmanifest lets the browser offer "install app", and pairs
       with the service worker (sw.js) for offline support. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <meta name="theme-color" content="#000000" />

  <!-- Montserrat from Google Fonts (Phase 6.5.5). The 400/600/800 set
       matches what the JS port uses for body, semi-bold, and the heading
       weight. Preconnects shave first-byte latency since the page also
       depends on fonts.gstatic.com (the actual woff2 host). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" />

  <!-- Tachyons CSS — switched from CDN to local during B-14 debugging
       (2026-05-23). Same 4.12.0 pin, just served from
       resources/public/css/. Local control lets us pair Tachyons
       with the Pesticide debug stylesheet (below) without CDN gymnastics. -->
  <link rel="stylesheet" href="css/tachyons.min.css" />

  <!-- B-14 dev probe: pesticide-depth outlines every element with a
       distinct color keyed to its tag AND nesting depth — the "rainbow"
       debug view used to visually inspect modal-shell's actual coverage
       in dev local. Comment out (or delete) this link before merging. -->
  <link rel="stylesheet" href="css/pesticide-depth.css" />

  <!-- App-specific custom rules (Phase 6.5.5). Ported verbatim from the
       JS port's App.css — the parts that AREN'T already covered by
       Tachyons (.montserrat, .h-15, .lh-135, .hover-button, etc.).
       Linked AFTER tachyons.min.css so equal-specificity rules win on
       cascade order. -->
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">Loading…</div>
  <script src="js/main/main.js"></script>
  <!-- Service worker registration (Phase 7.19). Path is scope-relative
       so the same script works on localhost and at any GH Pages
       subpath. The `?source=pwa` start_url in the manifest is
       independent of this registration. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('sw.js')
          .then((reg) => console.log('[SW] registered, scope:', reg.scope))
          .catch((err) => console.warn('[SW] registration failed:', err));
      });
    }
  </script>
</body>
</html>
